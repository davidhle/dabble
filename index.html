<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>David Dabbles :)</title>
    <!--
      Two Google Fonts (both OFL-licensed, like every Google Font):
      - 'DM Sans' - the app's BODY font (see src/index.css's --font-body
        comment) - everything that isn't a heading: paragraphs, buttons,
        form inputs, nav links, tags, panel content, tooltips, etc.
        wght@400/500/600/700 covers every Tailwind font-weight class
        actually used in the app (font-normal/medium/semibold/bold).
      - 'Young Serif' - headings only (h1/h2, the 'Dabble' wordmark - see
        --font-heading's own comment). Ships exactly one weight
        (400/Regular; there's no bold cut to request), so only its
        default weight is loaded.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Young+Serif&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
